<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo_project — interactive event flow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,680&family=Inconsolata:wght@460;680&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #efe4cf;
      --ink: #1b1712;
      --muted: #6d6254;
      --stamp: #9d1c14;
      --sent: #1c6b45;
      --lane: #f7f1e4;
      --rule: #2a241c;
      --wso2: #ff7300;
      --mq: #ff6600;
      --snow: #81b5a1;
      --glow: rgba(157, 28, 20, 0.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: "Inconsolata", ui-monospace, monospace;
      color: var(--ink);
      background:
        radial-gradient(circle at 88% 12%, rgba(157, 28, 20, 0.07), transparent 35%),
        linear-gradient(180deg, rgba(27, 23, 18, 0.05) 1px, transparent 1px) 0 0 / 100% 32px,
        var(--paper);
    }
    body.capture {
      width: 1280px;
      height: 820px;
      overflow: hidden;
    }
    .wrap {
      width: min(1240px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 100px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      flex-wrap: wrap;
    }
    .kicker {
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-size: 11px;
      color: var(--stamp);
    }
    h1 {
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(32px, 5vw, 42px);
      font-weight: 560;
      letter-spacing: -0.03em;
      line-height: 1;
      margin-top: 6px;
    }
    .nav-top a {
      color: var(--stamp);
      text-decoration: none;
      font-size: 13px;
    }
    .nav-top a:hover { text-decoration: underline; }
    .layout {
      display: grid;
      grid-template-columns: 1fr min(340px, 100%);
      gap: 20px;
      margin-top: 16px;
      align-items: start;
    }
    @media (max-width: 960px) {
      .layout { grid-template-columns: 1fr; }
    }
    .stage-panel {
      padding: 18px 20px;
      background: var(--lane);
      border: 1px solid var(--rule);
      border-left: 4px solid var(--stamp);
    }
    .stage-panel h2 {
      font-family: Fraunces, Georgia, serif;
      font-size: 24px;
      font-weight: 680;
      margin-bottom: 8px;
    }
    .stage-panel p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 12px;
    }
    .stage-panel ul {
      margin: 0;
      padding-left: 18px;
      color: var(--ink);
      font-size: 14px;
      line-height: 1.55;
    }
    .stage-panel li { margin-bottom: 6px; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 14px;
    }
    button, .pill {
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid var(--rule);
      background: #fff;
      color: var(--ink);
      padding: 8px 14px;
    }
    button:hover { background: var(--lane); }
    button:disabled { opacity: 0.45; cursor: default; }
    button.primary {
      background: var(--stamp);
      color: #fff;
      border-color: var(--stamp);
    }
    .steps {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }
    .pill {
      padding: 6px 10px;
      border-radius: 999px;
    }
    .pill.active {
      background: var(--stamp);
      color: #fff;
      border-color: var(--stamp);
    }
    .pill.done {
      border-color: var(--sent);
      color: var(--sent);
    }
    svg.pipeline {
      display: block;
      width: 100%;
      height: auto;
      max-height: 420px;
    }
    .track {
      fill: none;
      stroke: var(--rule);
      stroke-width: 2.5;
      stroke-dasharray: 8 10;
      opacity: 0.45;
    }
    .track-glow {
      fill: none;
      stroke: var(--stamp);
      stroke-width: 5;
      stroke-linecap: round;
      filter: blur(2px);
    }
    .node { cursor: pointer; }
    .node circle.bg {
      fill: var(--lane);
      stroke: var(--rule);
      stroke-width: 2;
      transition: fill 0.2s, stroke 0.2s;
    }
    .node:hover circle.bg { fill: #fff; }
    .node.active circle.bg {
      fill: #fff;
      stroke: var(--stamp);
      stroke-width: 3;
    }
    .node.active circle.ring {
      fill: none;
      stroke: var(--stamp);
      stroke-width: 1.5;
      opacity: 0.55;
    }
    .node[data-index="1"].active circle.bg { stroke: var(--wso2); }
    .node[data-index="4"].active circle.bg { stroke: var(--mq); }
    .node[data-index="6"].active circle.bg { stroke: var(--sent); }
    .node.done circle.bg {
      fill: #e8f3ec;
      stroke: var(--sent);
    }
    .node text.label {
      font-family: Fraunces, Georgia, serif;
      font-size: 15px;
      font-weight: 680;
      text-anchor: middle;
      fill: var(--ink);
      pointer-events: none;
    }
    .node text.sub {
      font-size: 10px;
      text-anchor: middle;
      fill: var(--muted);
      pointer-events: none;
      letter-spacing: 0.06em;
    }
    .packet { filter: drop-shadow(0 4px 12px var(--glow)); pointer-events: none; }
    .packet rect {
      fill: #fff;
      stroke: var(--stamp);
      stroke-width: 2;
    }
    .packet text { font-size: 11px; fill: var(--ink); }
    .badge { font-size: 9px; fill: var(--stamp); }
    .fork {
      fill: none;
      stroke: var(--stamp);
      stroke-width: 2;
      stroke-dasharray: 4 6;
      opacity: 0.55;
    }
    .fork.inactive { opacity: 0.2; }
    .path-toggle {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }
    .path-toggle button.active {
      background: var(--stamp);
      color: #fff;
      border-color: var(--stamp);
    }
    .node.dim { opacity: 0.22; pointer-events: none; }
    .node.spam-only { display: none; }
    body.mode-spam .node.normal-only { display: none; }
    body.mode-spam .node.spam-only { display: block; opacity: 1; pointer-events: auto; }
    body.mode-normal .node.spam-only { display: none; }
    body.capture .path-toggle { display: none; }
    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
    }
    .footer {
      margin-top: 16px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 8px 24px;
      justify-content: space-between;
    }
    .footer strong { color: var(--ink); }
    body.capture .controls,
    body.capture .hint,
    body.capture .steps { display: none; }
    body.capture .layout {
      grid-template-columns: 1fr;
    }
    body.capture .wrap { padding-bottom: 0; width: 1280px; }
    body.capture .stage-panel ul { font-size: 13px; }
    body.capture svg.pipeline { max-height: 340px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <div class="kicker">Demo_project · ITIL event management</div>
        <h1>One event travels the stack</h1>
      </div>
      <div class="nav-top">
        <span class="step-badge" id="stepBadge">Step 1 / 7</span>
        · <a href="/" id="boardLink">Event board</a>
      </div>
    </header>

    <div class="layout">
      <div>
        <div class="path-toggle" id="pathToggle">
          <button type="button" class="active" data-mode="normal">Standard event (alice)</button>
          <button type="button" data-mode="spam">Blocked sender (bob → spam)</button>
        </div>
        <svg class="pipeline" viewBox="0 0 1184 380" id="svg" role="img" aria-label="Event pipeline diagram">
          <path id="pathMain" class="track" />
          <path id="pathGlow" class="track-glow" />
          <path id="pathFork" class="fork" />
          <g id="nodes"></g>
          <g id="packet" class="packet"></g>
        </svg>
        <div class="controls" id="controls">
          <button type="button" id="btnPrev" aria-label="Previous step">← Previous</button>
          <button type="button" class="primary" id="btnNext" aria-label="Next step">Next →</button>
          <button type="button" id="btnPlay" aria-label="Play automatic tour">▶ Play tour</button>
          <span class="hint">Click a node · arrow keys · or use the step chips below</span>
        </div>
        <div class="steps" id="stepPills"></div>
        <div class="footer">
          <span><strong>Events ≠ incidents</strong> · queue-backed delivery · failures stay visible</span>
          <span>OAuth at WSO2 · async Quart · RabbitMQ · ServiceNow event</span>
        </div>
      </div>

      <aside>
        <div class="stage-panel" id="stagePanel">
          <h2 id="stageTitle">—</h2>
          <p id="stageDetail">—</p>
          <ul id="stageBullets"></ul>
        </div>
      </aside>
    </div>
  </div>

  <script>
    const CAPTURE = new URLSearchParams(location.search).has("capture");
    if (CAPTURE) document.body.classList.add("capture");
    if (location.protocol === "file:") {
      document.getElementById("boardLink").href = "../templates/desk.html";
    }
    if (location.hostname.endsWith("github.io")) {
      document.getElementById("boardLink").textContent = "GitHub repo";
      document.getElementById("boardLink").href = "https://github.com/matpet00/Demo_project";
    }

    const STAGES_NORMAL = [
      {
        id: "client", x: 72, y: 200, label: "Caller", sub: "alice",
        title: "1. API call leaves the client",
        detail: "Standard path: a trusted sender posts an event through the gateway.",
        bullets: [
          "POST /desk/v1/events through WSO2 (not the Table API).",
          "Authorization: Bearer … (OAuth from WSO2).",
          "JSON event payload, e.g. {\"description\":\"checkout-api is down\"}.",
          "Optional header: X-Correlation-Id.",
        ],
      },
      {
        id: "wso2", x: 240, y: 200, label: "WSO2", sub: "API Manager",
        title: "2. Gateway authenticates and enriches",
        detail: "WSO2 is the front door: subscription, throttling, mediation.",
        bullets: [
          "Validates token and subscription.",
          "Adds X-User-Name and X-User-Uuid (v5) — not from the JSON body.",
          "Forwards to ingest.",
        ],
      },
      {
        id: "ingest", x: 420, y: 200, label: "Ingest", sub: "Quart · api.py",
        title: "3. Ingest — UUID not blocked",
        detail: "Message saved; ReAct triage runs because alice is not on the block list.",
        bullets: [
          "202 Accepted · row in MySQL · correlation id.",
          "Block list miss → agent runs.",
          "Fork: blocked UUID would skip the agent (see spam branch).",
        ],
      },
      {
        id: "agent", x: 600, y: 200, label: "ReAct agent", sub: "AI + fallback",
        title: "4. ReAct loop classifies severity",
        detail: "Thought → Action → Observation; priority 1–5 is derived here.",
        bullets: [
          "lookup_service(description), then classify_priority(description).",
          "OpenRouter or ScriptedBrain fallback.",
          "Trace stored on the message.",
        ],
      },
      {
        id: "rabbit", x: 780, y: 200, label: "RabbitMQ", sub: "priority queue",
        title: "5. Durable queue handoff",
        detail: "Published to priority1_queue … priority5_queue.",
        bullets: [
          "Exchange events (direct), durable message.",
          "Decouples accept from ServiceNow delivery.",
        ],
      },
      {
        id: "delivery", x: 960, y: 200, label: "Delivery", sub: "Quart · worker",
        title: "6. Delivery → ServiceNow event",
        detail: "Consumer maps fields and creates an event record.",
        bullets: [
          "source, node, severity, message_key, additional_info.",
          "Retries; failed_snow_delivery after 3 failures.",
        ],
      },
      {
        id: "snow", x: 1112, y: 200, label: "ServiceNow", sub: "u_itil_event",
        title: "7. Event created — not an incident",
        detail: "ITIL Event Management lane completes.",
        bullets: [
          "status sent + event number.",
          "Logs in Grafana/Loki by correlation id.",
        ],
      },
    ];

    const STAGES_SPAM = [
      {
        id: "client", x: 72, y: 200, label: "Caller", sub: "bob (blocked)",
        title: "1. Same API call — blocked user",
        detail: "bob uses the same POST /events contract, but their mediation UUID is on the block list.",
        bullets: [
          "Same gateway and JSON payload shape as a normal sender.",
          "Identity still comes from WSO2 headers, not the body.",
        ],
      },
      {
        id: "wso2", x: 240, y: 200, label: "WSO2", sub: "API Manager",
        title: "2. Gateway still authenticates bob",
        detail: "OAuth succeeds; mediation sets X-User-Name: bob and the stable UUID.",
        bullets: [
          "Being blocked is enforced in ingest, not at the gateway.",
          "Useful for ITIL suppression without sharing SN credentials.",
        ],
      },
      {
        id: "ingest", x: 420, y: 200, label: "Ingest", sub: "block list hit",
        title: "3. Ingest — UUID blocked, agent skipped",
        detail: "No ReAct loop, no priority queues — straight to events.spam.",
        bullets: [
          "202 still returned; message persisted for audit.",
          "queue_name = events.spam · trace stays empty.",
          "ITIL suppression before ServiceNow sees the signal.",
        ],
      },
      {
        id: "spamq", x: 640, y: 280, label: "events.spam", sub: "RabbitMQ",
        title: "4. Spam queue",
        detail: "Dedicated queue for blocked senders.",
        bullets: [
          "Same exchange events; routing key events.spam.",
          "Delivery worker is the consumer (same process as normal events).",
        ],
      },
      {
        id: "delivery", x: 880, y: 280, label: "Delivery", sub: "mail only",
        title: "5. Delivery — no ServiceNow",
        detail: "Consumer detects spam queue and sends notification mail only.",
        bullets: [
          "Subject: Spammer detected.",
          "Body: event was not processed + username, UUID, message id.",
          "ServiceNow is not called.",
        ],
      },
      {
        id: "mail", x: 1100, y: 280, label: "Mailpit", sub: "not_processed",
        title: "6. Suppressed — status not_processed",
        detail: "End state for the spam branch.",
        bullets: [
          "Message status not_processed on the board.",
          "If mail fails 3× → events.dlq.",
          "Event is not rewritten as an incident.",
        ],
      },
    ];

    function buildPathD(stages) {
      const pts = stages.map(s => [s.x, s.y]);
      let d = `M ${pts[0][0]} ${pts[0][1]}`;
      for (let i = 1; i < pts.length; i++) {
        const prev = pts[i - 1];
        const cur = pts[i];
        const mx = (prev[0] + cur[0]) / 2;
        d += ` C ${mx} ${prev[1]}, ${mx} ${cur[1]}, ${cur[0]} ${cur[1]}`;
      }
      return d;
    }

    const pathEl = document.getElementById("pathMain");
    const pathGlow = document.getElementById("pathGlow");
    const forkEl = document.getElementById("pathFork");
    forkEl.setAttribute("d", "M 420 200 C 420 250, 520 280, 640 280");

    const nodesG = document.getElementById("nodes");
    const pillsG = document.getElementById("stepPills");
    const packetG = document.getElementById("packet");

    let pathMode = "normal";
    let STAGES = STAGES_NORMAL;
    let path = pathEl;
    let totalLength = 0;

    function refreshPathGeometry() {
      const d = buildPathD(STAGES);
      pathEl.setAttribute("d", d);
      pathGlow.setAttribute("d", d);
      path = pathEl;
      totalLength = path.getTotalLength();
    }

    function rebuildStepsUi() {
      nodesG.innerHTML = "";
      pillsG.innerHTML = "";
      STAGES.forEach((s, i) => {
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.classList.add("node");
        g.dataset.index = i;
        g.setAttribute("role", "button");
        g.setAttribute("tabindex", "0");
        g.setAttribute("aria-label", `Step ${i + 1}: ${s.label}`);
        g.innerHTML = `
          <circle class="ring" cx="${s.x}" cy="${s.y}" r="44"/>
          <circle class="bg" cx="${s.x}" cy="${s.y}" r="36"/>
          <text class="label" x="${s.x}" y="${s.y - 2}">${s.label}</text>
          <text class="sub" x="${s.x}" y="${s.y + 14}">${s.sub}</text>
        `;
        g.addEventListener("click", () => setStep(i));
        g.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setStep(i); }
        });
        nodesG.appendChild(g);

        const pill = document.createElement("button");
        pill.type = "button";
        pill.className = "pill";
        pill.textContent = `${i + 1}. ${s.label}`;
        pill.addEventListener("click", () => setStep(i));
        pillsG.appendChild(pill);
      });
      refreshPathGeometry();
    }

    function setPathMode(mode, silent = false) {
      if (pathMode === mode) return;
      pathMode = mode;
      STAGES = mode === "spam" ? STAGES_SPAM : STAGES_NORMAL;
      document.querySelectorAll("#pathToggle button").forEach((b) => {
        b.classList.toggle("active", b.dataset.mode === mode);
      });
      document.body.classList.toggle("mode-spam", mode === "spam");
      document.body.classList.toggle("mode-normal", mode === "normal");
      rebuildStepsUi();
      if (!silent) setStep(0, false);
    }

    let stepIndex = 0;
    let animProgress = 0;
    let animTarget = 0;
    let animating = false;
    let playTimer = null;

    function progressForStep(i) {
      return i / (STAGES.length - 1);
    }

    function packetLines(stageId) {
      const base = ['{ "description": "checkout-api is down" }'];
      const normal = {
        client: [],
        wso2: ["— gateway adds —", "X-User-Name: alice", "X-User-Uuid: ••••"],
        ingest: ["202 · saved · MySQL", "correlation_id assigned"],
        agent: ["ReAct: lookup_service →", "classify_priority → P1"],
        rabbit: ["→ priority1_queue", "exchange: events"],
        delivery: ["→ ServiceNow event API", "severity · message_key"],
        snow: ["status: sent", "event EM001…"],
      };
      const spam = {
        client: ["sender: bob (blocked UUID)"],
        wso2: ["X-User-Name: bob", "X-User-Uuid: ••••"],
        ingest: ["block list HIT", "agent skipped", "→ events.spam"],
        spamq: ["queue: events.spam"],
        delivery: ["Spammer detected (mail)", "ServiceNow not called"],
        mail: ["status: not_processed"],
      };
      const extra = pathMode === "spam" ? spam : normal;
      return base.concat(extra[stageId] || []);
    }

    function renderPacketAtProgress(progress) {
      progress = Math.min(1, Math.max(0, progress));
      const idx = Math.min(
        STAGES.length - 1,
        Math.max(0, Math.round(progress * (STAGES.length - 1))),
      );
      const stage = STAGES[idx];
      const point = path.getPointAtLength(progress * totalLength);
      const lines = packetLines(stage.id);
      const w = 196;
      const h = 28 + lines.length * 15;
      const px = point.x - w / 2;
      const py = point.y - h - 32;
      let inner = "";
      for (let t = 0; t < 3; t++) {
        const trail = path.getPointAtLength(Math.max(0, progress * totalLength - t * 28));
        inner += `<circle cx="${trail.x}" cy="${trail.y}" r="${7 - t * 2}" fill="#9d1c14" opacity="${0.12 - t * 0.03}"/>`;
      }
      inner += `<rect x="${px}" y="${py}" width="${w}" height="${h}" rx="8"/>`;
      lines.forEach((line, i) => {
        inner += `<text class="${i ? "badge" : ""}" x="${px + 10}" y="${py + 20 + i * 15}">${line}</text>`;
      });
      packetG.innerHTML = inner;
      return idx;
    }

    function updateCopy(idx) {
      const stage = STAGES[idx];
      document.getElementById("stepBadge").textContent = `Step ${idx + 1} / ${STAGES.length}`;
      document.getElementById("stageTitle").textContent = stage.title;
      document.getElementById("stageDetail").textContent = stage.detail;
      const ul = document.getElementById("stageBullets");
      ul.innerHTML = stage.bullets.map(b => `<li>${b}</li>`).join("");

      document.querySelectorAll(".node").forEach((n, i) => {
        n.classList.remove("active", "done");
        if (i < idx) n.classList.add("done");
        if (i === idx) n.classList.add("active");
      });
      pillsG.querySelectorAll(".pill").forEach((p, i) => {
        p.classList.remove("active", "done");
        if (i < idx) p.classList.add("done");
        if (i === idx) p.classList.add("active");
      });

      document.getElementById("btnPrev").disabled = idx === 0;
      document.getElementById("btnNext").disabled = idx === STAGES.length - 1;
      const forkHot = pathMode === "spam" || (pathMode === "normal" && idx === 2);
      forkEl.classList.toggle("inactive", !forkHot);
    }

    function showBranchInterstitial() {
      document.getElementById("stepBadge").textContent = "Branch";
      document.getElementById("stageTitle").textContent = "Blocked sender path (bob)";
      document.getElementById("stageDetail").textContent =
        "Same POST /events through WSO2 — ingest matches the UUID on the block list, skips ReAct, and publishes to events.spam.";
      document.getElementById("stageBullets").innerHTML = [
        "No priority queues · no ServiceNow row.",
        "Delivery sends mail; status not_processed.",
      ].map((b) => `<li>${b}</li>`).join("");
      packetG.innerHTML = "";
      forkEl.classList.remove("inactive");
    }

    function paint(progress) {
      animProgress = progress;
      const idx = renderPacketAtProgress(progress);
      pathGlow.style.opacity = String(0.15 + progress * 0.45);
      pathGlow.style.strokeDasharray = `${totalLength * progress} ${totalLength}`;
      if (idx !== stepIndex) stepIndex = idx;
      updateCopy(idx);
    }

    function setStep(idx, animate = true) {
      stopPlay();
      idx = Math.max(0, Math.min(STAGES.length - 1, idx));
      stepIndex = idx;
      animTarget = progressForStep(idx);
      if (!animate) {
        paint(animTarget);
        return;
      }
      animating = true;
      const start = animProgress;
      const startTime = performance.now();
      const duration = 450;
      function tick(now) {
        const t = Math.min(1, (now - startTime) / duration);
        const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        paint(start + (animTarget - start) * eased);
        if (t < 1) requestAnimationFrame(tick);
        else animating = false;
      }
      requestAnimationFrame(tick);
    }

    function stopPlay() {
      if (playTimer) {
        clearInterval(playTimer);
        playTimer = null;
      }
      document.getElementById("btnPlay").textContent = "▶ Play tour";
    }

    function startPlay() {
      if (playTimer) {
        stopPlay();
        return;
      }
      document.getElementById("btnPlay").textContent = "⏸ Pause";
      if (stepIndex >= STAGES.length - 1) setStep(0, false);
      playTimer = setInterval(() => {
        if (animating) return;
        if (stepIndex >= STAGES.length - 1) {
          stopPlay();
          return;
        }
        setStep(stepIndex + 1);
      }, 2800);
    }

    document.getElementById("btnPrev").addEventListener("click", () => setStep(stepIndex - 1));
    document.getElementById("btnNext").addEventListener("click", () => setStep(stepIndex + 1));
    document.getElementById("btnPlay").addEventListener("click", startPlay);

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") setStep(stepIndex - 1);
      if (e.key === "ArrowRight") setStep(stepIndex + 1);
      if (e.key === "Home") setStep(0);
      if (e.key === "End") setStep(STAGES.length - 1);
    });

    /* GIF capture — normal path, branch card, spam path */
    const travelFrames = CAPTURE ? 18 : 12;
    const holdFrames = CAPTURE ? 48 : 11;
    const segmentFrames = travelFrames + holdFrames;
    const branchPauseFrames = CAPTURE ? 36 : 0;

    function framesForStageList(stages) {
      return (stages.length - 1) * segmentFrames + holdFrames;
    }

    function frameToProgress(stages, frame) {
      const totalFrames = framesForStageList(stages);
      if (frame >= totalFrames - 1) return 1;
      const seg = Math.floor(frame / segmentFrames);
      const local = frame % segmentFrames;
      const last = stages.length - 1;
      const segStart = Math.min(1, seg / last);
      const segEnd = Math.min(1, (seg + 1) / last);
      if (local < travelFrames) {
        const t = local / travelFrames;
        const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        return segStart + (segEnd - segStart) * eased;
      }
      return segEnd;
    }

    const normalCaptureFrames = framesForStageList(STAGES_NORMAL);
    const spamCaptureFrames = framesForStageList(STAGES_SPAM);
    window.totalFlowFrames = normalCaptureFrames + branchPauseFrames + spamCaptureFrames;

    window.renderFlowFrame = function(frame) {
      if (frame < normalCaptureFrames) {
        if (pathMode !== "normal") setPathMode("normal", true);
        const progress = frameToProgress(STAGES_NORMAL, frame);
        stepIndex = Math.round(progress * (STAGES_NORMAL.length - 1));
        paint(progress);
        return;
      }
      if (frame < normalCaptureFrames + branchPauseFrames) {
        setPathMode("spam", true);
        showBranchInterstitial();
        return;
      }
      const local = frame - normalCaptureFrames - branchPauseFrames;
      const progress = frameToProgress(STAGES_SPAM, local);
      stepIndex = Math.round(progress * (STAGES_SPAM.length - 1));
      paint(progress);
    };

    document.getElementById("pathToggle").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-mode]");
      if (btn) setPathMode(btn.dataset.mode);
    });

    document.body.classList.add("mode-normal");
    rebuildStepsUi();

    if (CAPTURE) {
      window.renderFlowFrame(0);
    } else {
      setStep(0, false);
    }
  </script>
</body>
</html>
